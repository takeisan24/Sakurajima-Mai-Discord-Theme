<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#a895d6" flood-opacity="0.6"/>
    </filter>
  </defs>
  <!-- Sakurajima Mai Bunny Hairpin Barrette -->
  <g filter="url(#glow)">
    <!-- Left Ear -->
    <path d="M 36 50 C 30 30, 32 10, 39 8 C 45 6, 47 25, 45 50 Z" fill="#F4F2F7"/>
    <path d="M 37 42 C 34 28, 35 15, 39 14 C 43 13, 44 24, 43 42 Z" fill="#E8DCF2"/>
    <!-- Right Ear -->
    <path d="M 55 50 C 53 25, 55 6, 61 8 C 68 10, 70 30, 64 50 Z" fill="#F4F2F7"/>
    <path d="M 57 42 C 56 24, 57 13, 61 14 C 65 15, 66 28, 63 42 Z" fill="#E8DCF2"/>
    <!-- Head -->
    <ellipse cx="50" cy="58" rx="22" ry="20" fill="#F4F2F7"/>
    <!-- Eyes -->
    <ellipse cx="42" cy="56" rx="2.5" ry="3.5" fill="#8E77B8"/>
    <ellipse cx="58" cy="56" rx="2.5" ry="3.5" fill="#8E77B8"/>
    <!-- Eye highlights -->
    <circle cx="41" cy="54" r="1" fill="#FFFFFF"/>
    <circle cx="57" cy="54" r="1" fill="#FFFFFF"/>
    <!-- Nose -->
    <ellipse cx="50" cy="62" rx="1.5" ry="1.2" fill="#E0B494"/>
    <!-- Barrette Clip Base -->
    <rect x="28" y="74" width="44" height="5" rx="2.5" fill="#C8C4D0"/>
    <rect x="30" y="75" width="40" height="3" rx="1.5" fill="#A895D6"/>
